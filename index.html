<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labirinto dos Tesouros</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
       
        body {
            background-color: #1a202c;
            color: white;
            touch-action: pan-x pan-y;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        .game-container {
            flex: 1;
            width: 100%;
            max-width: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .mobile-controls {
            display: none;
            width: 100%;
            max-width: 600px;
            margin: 10px auto;
            position: relative;
            padding: 0 20px;
        }

        .joystick {
            position: relative;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(74, 85, 104, 0.35) 0%, rgba(74, 85, 104, 0.6) 100%);
            border: 2px solid rgba(160, 174, 192, 0.5);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            flex-shrink: 0;
        }

        .joystick-knob {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 56px;
            height: 56px;
            margin: -28px 0 0 -28px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #68d391, #2f855a);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            transition: transform 0.12s ease-out;
        }

        .joystick.active .joystick-knob {
            transition: none;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            background: rgba(74, 85, 104, 0.7);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .shoot-control {
            margin-left: auto;
            align-self: center;
        }

        .shoot-control .control-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            font-size: 32px;
        }

        .control-btn:active {
            background: rgba(74, 85, 104, 0.9);
            transform: scale(0.95);
        }

        @media (max-width: 768px) {
            .mobile-controls {
                display: flex;
                align-items: center;
                padding-right: 40px; /* Aumentado para mover mais à direita */
            }
        }

        @media (max-width: 400px) {
            .mobile-controls {
                padding: 0 20px;
            }
        }

        .maze-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 120px; /* Espaço para os controles */
        }

        .controls {
            position: sticky;
            bottom: 20px;
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 240px;
            padding: 0px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 12px;
            z-index: 100;
            margin: 0 auto;
        }

        @media (max-width: 768px) {
            .controls { 
                display: grid;
                bottom: 20px;
            }
        }
        .maze-container {
            display: inline-block;
            border: 2px solid #4a5568;
            padding: 2px;
            background-color: #1a202c;
        }
        .maze-row {
            display: flex;
            margin: 0;
            padding: 0;
        }
        .cell {
            width: min(32px, 6vw);
            height: min(32px, 6vw);
            margin: 0;
            padding: 0;
            border: 1px solid #2d3748;
        }
        .wall { background-color: #1a202c; }
        .path { background-color: #2d3748; }
        .player {
            background-color: #48bb78;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        .enemy {
            background-color: #f56565;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        .treasure {
            background-color: #f6e05e;
            animation: shine 1s infinite;
        }
        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .game-over.active { display: flex; }
        .heart-full {
            color: #f56565;
            display: inline-block;
            margin: 0 2px;
        }
        .heart-empty {
            color: #4a5568;
            display: inline-block;
            margin: 0 2px;
        }
        .control-btn:active {
            background: rgba(74, 85, 104, 0.9);
        }
       
        .bullet {
            background-color: white;
            border-radius: 50%;
            width: 10px !important;
            height: 10px !important;
            position: relative;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            animation: shine 1s infinite;
        }

        .shot {
            position: relative;
        }

        .shot::after {
            content: '';
            position: absolute;
            background-color: white;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .enemy-hit {
            animation: explode 0.3s ease-out;
            z-index: 10;
        }

        .heart {
            color: #f56565;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            animation: pulse 2s infinite;
        }

        @keyframes explode {
            0% { 
                transform: scale(1); 
                background-color: #f56565;
            }
            50% { 
                transform: scale(1.8); 
                background-color: #ff9999;
                box-shadow: 0 0 20px #ff0000;
            }
            100% { 
                transform: scale(1); 
                background-color: #f56565;
            }
        }

        @keyframes pulse {
            0% { transform: scale(0.95); }
            50% { transform: scale(1.05); }
            100% { transform: scale(0.95); }
        }

        @keyframes shine {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }

    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    <div class="game-container">
      
        <div class="text-white mb-4 text-center">
            <!-- Título -->
            <div class="w-full max-w-2xl mx-auto mb-2">
                <h1 class="text-xl md:text-3xl font-bold">Labirinto dos Tesouros</h1>
            </div>
            <!-- Container para as informações do jogo -->
            <div class="flex flex-wrap justify-center gap-4 text-sm md:text-base">
                <div>Nível: <span id="level">1</span></div>
                <div>Pontuação: <span id="score">0</span></div>
                <div>Tesouros: <span id="treasures">0</span></div>
                <div>Balas: <span id="bullets">0</span></div>
            </div>
            
            <!-- Container para vidas e botão de pausa -->
            <div class="flex justify-center items-center gap-4 mb-2">
                <div id="lives"></div>
                <button id="pauseButton" class="bg-gray-800 hover:bg-gray-700 text-white font-bold p-0.5 rounded text-xs mt-1">
                    ⏸️
                </button>
            </div>
        </div>
        
        <!-- Adicione o overlay de pausa logo após -->
        <div id="pauseOverlay" class="fixed inset-0 bg-black bg-opacity-80 hidden flex items-center justify-center z-50">
            <div class="bg-gray-800 p-8 rounded-lg text-white text-center">
                <h2 class="text-2xl mb-4">Jogo Pausado</h2>
                <p class="hidden md:block mb-4 text-gray-400">Pressione P ou clique para continuar</p>
                <button id="resumeButton" class="bg-green-500 px-4 py-2 rounded hover:bg-green-600">
                    Continuar
                </button>
            </div>
        </div>
        
        <div class="maze-wrapper">
            <div id="maze" class="maze-container"></div>
            <div class="mobile-controls">
                <div class="joystick" id="joystick">
                    <div class="joystick-knob" id="joystickKnob"></div>
                </div>
                <div class="shoot-control">
                    <div class="control-btn" id="btnShoot">⚪</div>
                </div>
            </div>
         </div>
    </div>
    
    <div id="gameOver" class="game-over">
        <div class="bg-gray-800 p-8 rounded-lg text-white text-center">
            <h2 class="text-2xl mb-4">Game Over!</h2>
            <p class="mb-4">Nível Alcançado: <span id="finalLevel">0</span></p>
            <p class="mb-4">Pontuação Final: <span id="finalScore">0</span></p>
            <p class="hidden md:block mb-4 text-gray-400">Pressione Enter para jogar novamente</p>
            <button onclick="startGame()" class="md:hidden bg-green-500 px-4 py-2 rounded hover:bg-green-600">
                Clique aqui para jogar novamente
            </button>
        </div>
    </div>

    <script>
        const MAZE_SIZE = 15;
        let maze = [];
        let player = { x: 1, y: 1 };
        let enemies = [];
        let treasures = [];
        let level = 0;
        let score = 0;
        let lives = 0;
        let gameInterval;
        let isGameOver = false;
        let moveCounter = 0;
        let touchStartX = 0;
        let touchStartY = 0;
        let moveInterval = null;
        let moveSpeed = 150; // Velocidade inicial de movimento
        let holdStartTime = 0;
        let currentDirection = null;
        let bullets = 0;
        let shots = [];
        let lastDirection = 'right'; // Direção inicial do jogador
        let bulletSpawnChance = 0.025;
        let isPaused = false;
        let heartSpawnChance = 0.009; // 0,9% de chance de gerar coração

        // _________________________________________________________________
        //
        // Controle do som
        // _________________________________________________________________

        class AudioManager {
            constructor() {
                this.context = new (window.AudioContext || window.webkitAudioContext)();
                this.sounds = {};
                this.isMuted = false;
                this.loadSounds();
            }

            async loadSounds() {
                // Função auxiliar para tocar uma sequência de notas
                const playSequence = (notes) => {
                    notes.forEach((note, index) => {
                        setTimeout(() => {
                            const oscillator = this.context.createOscillator();
                            const gainNode = this.context.createGain();
                            
                            oscillator.type = note.type || 'sine';
                            oscillator.frequency.setValueAtTime(note.frequency, this.context.currentTime);
                            
                            gainNode.gain.setValueAtTime(note.gain || 0.2, this.context.currentTime);
                            gainNode.gain.exponentialRampToValueAtTime(0.01, this.context.currentTime + note.duration);
                            
                            oscillator.connect(gainNode);
                            gainNode.connect(this.context.destination);
                            
                            oscillator.start();
                            oscillator.stop(this.context.currentTime + note.duration);
                        }, index * 100); // 100ms entre cada nota
                    });
                };

                // Função auxiliar para criar sons usando oscilador
                const createOscillatorSound = (frequency, duration, type = 'sine') => {
                    const oscillator = this.context.createOscillator();
                    const gainNode = this.context.createGain();
                    
                    oscillator.type = type;
                    oscillator.frequency.setValueAtTime(frequency, this.context.currentTime);
                    
                    gainNode.gain.setValueAtTime(0.2, this.context.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, this.context.currentTime + duration);
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(this.context.destination);
                    
                    return { oscillator, gainNode, duration };
                };

                // Som de tiro (som agudo curto)
                this.sounds.shoot = () => {
                    const sound = createOscillatorSound(880, 0.1, 'square');
                    sound.oscillator.start();
                    sound.oscillator.stop(this.context.currentTime + sound.duration);
                };

                // Som de coleta de tesouro (som ascendente)
                this.sounds.collectTreasure = () => {
                    const oscillator = this.context.createOscillator();
                    const gainNode = this.context.createGain();
                    
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(440, this.context.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(880, this.context.currentTime + 0.2);
                    
                    gainNode.gain.setValueAtTime(0.5, this.context.currentTime); // Aumentado de ~0.2 para 0.5
                    gainNode.gain.exponentialRampToValueAtTime(0.01, this.context.currentTime + 0.2);
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(this.context.destination);
                    
                    oscillator.start();
                    oscillator.stop(this.context.currentTime + 0.2);
                };

                // Som de morte do inimigo (som descendente com ruído)
                this.sounds.enemyDeath = () => {
                    const oscillator = this.context.createOscillator();
                    const gainNode = this.context.createGain();
                    
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.setValueAtTime(440, this.context.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(110, this.context.currentTime + 0.3);
                    
                    gainNode.gain.setValueAtTime(0.3, this.context.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, this.context.currentTime + 0.3);
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(this.context.destination);
                    
                    oscillator.start();
                    oscillator.stop(this.context.currentTime + 0.3);
                };

                // Som de morte do jogador (som grave e longo)
                this.sounds.playerDeath = () => {
                    const oscillator = this.context.createOscillator();
                    const gainNode = this.context.createGain();
                    
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(440, this.context.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(55, this.context.currentTime + 0.5);
                    
                    gainNode.gain.setValueAtTime(0.7, this.context.currentTime); // Aumentado de 0.4 para 0.7
                    gainNode.gain.exponentialRampToValueAtTime(0.01, this.context.currentTime + 0.5);
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(this.context.destination);
                    
                    oscillator.start();
                    oscillator.stop(this.context.currentTime + 0.5);
                };

                // Melodia de game over (sequência de notas tristes descendentes)
                this.sounds.gameOver = () => {
                    const baseFreq = 440; // Nota A4
                    const notes = [
                        { frequency: baseFreq, duration: 0.2, type: 'sine', gain: 0.5 },      // A4 (mais alto)
                        { frequency: baseFreq * 0.75, duration: 0.2, type: 'sine', gain: 0.45 }, // F4
                        { frequency: baseFreq * 0.5, duration: 0.4, type: 'sine', gain: 0.4 }, // A3
                        { frequency: baseFreq * 0.25, duration: 0.6, type: 'sine', gain: 0.35 }  // A2 (ainda audível)
                    ];
                    playSequence(notes);
                };

                // Melodia de level up (sequência de notas alegres em arpejo)
                this.sounds.levelUp = () => {
                    const baseFreq = 440; // Nota A4
                    const notes = [
                        { frequency: baseFreq, duration: 0.15, type: 'sine', gain: 0.2 },       // A4
                        { frequency: baseFreq * 1.25, duration: 0.15, type: 'sine', gain: 0.2 }, // C#5
                        { frequency: baseFreq * 1.5, duration: 0.15, type: 'sine', gain: 0.2 },  // E5
                        { frequency: baseFreq * 2, duration: 0.2, type: 'sine', gain: 0.25 },    // A5 (mais longa e um pouco mais alta)
                    ];
                    playSequence(notes);
                };
            }

            play(soundName) {
                if (this.isMuted || !this.sounds[soundName]) return;
                
                // Garante que o contexto está executando (necessário devido às políticas dos navegadores)
                if (this.context.state === 'suspended') {
                    this.context.resume();
                }
                
                this.sounds[soundName]();
            }

            toggleMute() {
                this.isMuted = !this.isMuted;
                return this.isMuted;
            }
        }

        // Cria uma instância global do gerenciador de áudio
        const audioManager = new AudioManager();

        // Adiciona botão de mute na interface
        const addMuteButton = () => {
            const controls = document.querySelector('.flex.justify-center.items-center.gap-4.mb-2');
            const muteButton = document.createElement('button');
            muteButton.className = 'bg-gray-800 hover:bg-gray-700 text-white font-bold p-0.5 rounded text-xs mt-1';
            muteButton.innerHTML = '🔊';
            muteButton.onclick = () => {
                const isMuted = audioManager.toggleMute();
                muteButton.innerHTML = isMuted ? '🔈' : '🔊';
            };
            controls.appendChild(muteButton);
        };

        // Chama a função para adicionar o botão quando a página carregar
        window.addEventListener('load', addMuteButton);

        // _________________________________________________________________
        //
        // Labirinto
        // _________________________________________________________________

        function createMaze() {
            maze = Array(MAZE_SIZE).fill().map(() => Array(MAZE_SIZE).fill(1));
            
            function recursiveBacktracking(x, y) {
                const directions = [[0, -2], [2, 0], [0, 2], [-2, 0]];
                
                for (let i = directions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [directions[i], directions[j]] = [directions[j], directions[i]];
                }
                
                maze[y][x] = 0;
                
                for (const [dx, dy] of directions) {
                    const nextX = x + dx;
                    const nextY = y + dy;
                    const middleX = x + dx/2;
                    const middleY = y + dy/2;
                    
                    if (nextX > 0 && nextX < MAZE_SIZE - 1 && 
                        nextY > 0 && nextY < MAZE_SIZE - 1 && 
                        maze[nextY][nextX] === 1) {
                        maze[middleY][middleX] = 0;
                        maze[nextY][nextX] = 0;
                        recursiveBacktracking(nextX, nextY);
                    }
                }
            }
            
            recursiveBacktracking(1, 1);
            
            // Aumenta o número de caminhos extras (era MAZE_SIZE * 1.5)
            for (let i = 0; i < MAZE_SIZE * 3; i++) {
                const x = Math.floor(Math.random() * (MAZE_SIZE - 2)) + 1;
                const y = Math.floor(Math.random() * (MAZE_SIZE - 2)) + 1;
                
                if (maze[y][x] === 1) {
                    const neighbors = [
                        [x+1, y], [x-1, y],
                        [x, y+1], [x, y-1]
                    ].filter(([nx, ny]) => 
                        nx > 0 && nx < MAZE_SIZE - 1 &&
                        ny > 0 && ny < MAZE_SIZE - 1 &&
                        maze[ny][nx] === 0
                    );
                    
                    // Aumenta a probabilidade de criar caminhos (era neighbors.length >= 2)
                    if (neighbors.length >= 1 && Math.random() < 0.8) { // Aumentou probabilidade também
                        maze[y][x] = 0;
                    }
                }
            }
            
            // Garante áreas mais abertas perto do jogador e inimigo
            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    if (1 + dx > 0 && 1 + dx < MAZE_SIZE - 1 && 
                        1 + dy > 0 && 1 + dy < MAZE_SIZE - 1) {
                        maze[1 + dy][1 + dx] = 0;
                    }
                    if (MAZE_SIZE - 2 + dx > 0 && MAZE_SIZE - 2 + dx < MAZE_SIZE - 1 && 
                        MAZE_SIZE - 2 + dy > 0 && MAZE_SIZE - 2 + dy < MAZE_SIZE - 1) {
                        maze[MAZE_SIZE - 2 + dy][MAZE_SIZE - 2 + dx] = 0;
                    }
                }
            }
            
            maze[1][1] = 0;
            maze[MAZE_SIZE - 2][MAZE_SIZE - 2] = 0;
            
            return maze;
        }

        function placeTreasures() {

            // Aumenta número de tesouros após nível 15
            const baseNumTreasures = 3 + Math.floor(level / 2);
            const bonusTreasures = level > 15 ? Math.floor((level - 15) / 3) : 0;
            const numTreasures = Math.min(baseNumTreasures + bonusTreasures, 15); // Máximo de 15 tesouros
            
            treasures = [];
            
            while (treasures.length < numTreasures) {
                const x = Math.floor(Math.random() * (MAZE_SIZE - 2)) + 1;
                const y = Math.floor(Math.random() * (MAZE_SIZE - 2)) + 1;
                
                if (maze[y][x] === 0 && 
                    !treasures.some(t => t.x === x && t.y === y) &&
                    !(x === player.x && y === player.y) &&
                    !enemies.some(e => e.x === x && e.y === y)) {
                    treasures.push({x, y});
                }
            }
        }

        function updateLives() {
            const livesContainer = document.getElementById('lives');
            const heartsHtml = Array(5).fill(0).map((_, i) => 
                i < lives ? '❤️' : '<span style="opacity: 0.3">❤️</span>'
            ).join('');
            livesContainer.innerHTML = heartsHtml;
        }


        function renderMaze() {
            const mazeElement = document.getElementById('maze');
            mazeElement.innerHTML = '';
            
            for (let y = 0; y < MAZE_SIZE; y++) {
                const row = document.createElement('div');
                row.className = 'maze-row';
                
                for (let x = 0; x < MAZE_SIZE; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    if (maze[y][x] === 1) {
                        cell.classList.add('wall');
                    } else {
                        cell.classList.add('path');
                    }
                    
                    if (x === player.x && y === player.y) {
                        cell.classList.add('player');
                    }

                    if (enemies.some(e => e.x === x && e.y === y)) {
                        cell.classList.add('enemy');
                        const enemy = enemies.find(e => e.x === x && e.y === y);
                        if (enemy.exploding) {
                            cell.classList.add('enemy-hit');
                        }
                    }

                    if (treasures.some(t => t.x === x && t.y === y)) {
                        cell.classList.add('treasure');
                    }

                    // Adicione renderização de tiros
                    if (shots.some(shot => shot.x === x && shot.y === y)) {
                        cell.classList.add('shot');
                    }
                    
                    // Adicione renderização de balas coletáveis
                    if (maze[y][x] === 2) { // 2 representa uma bala coletável
                        const bullet = document.createElement('div');
                        bullet.className = 'bullet';
                        cell.appendChild(bullet);
                    }

                    // Adicione renderização de corações
                    if (maze[y][x] === 3) { // 3 representa um coração
                        const heart = document.createElement('div');
                        heart.className = 'heart';
                        heart.innerHTML = '❤️';
                        cell.appendChild(heart);
                    }
                    
                    row.appendChild(cell);
                }
                mazeElement.appendChild(row);
            }

            document.getElementById('level').textContent = level;
            document.getElementById('score').textContent = score.toLocaleString();
            document.getElementById('treasures').textContent = treasures.length;
            updateLives();
        }

        function initializeEnemies(numEnemies) {
            let enemies = [];
            
            // Define regiões do mapa para distribuir os inimigos
            const regions = [
                { x: MAZE_SIZE - 2, y: MAZE_SIZE - 2 },     // Canto inferior direito
                { x: MAZE_SIZE - 2, y: 1 },                 // Canto superior direito
                { x: 1, y: MAZE_SIZE - 2 },                 // Canto inferior esquerdo
                { x: Math.floor(MAZE_SIZE/2), y: MAZE_SIZE - 2 },  // Centro inferior
                { x: MAZE_SIZE - 2, y: Math.floor(MAZE_SIZE/2) },  // Centro direito
                { x: 1, y: Math.floor(MAZE_SIZE/2) },             // Centro esquerdo
                { x: Math.floor(MAZE_SIZE/2), y: 1 }              // Centro superior
            ];
            
            // Limita o número de inimigos ao número de regiões disponíveis
            const actualNumEnemies = Math.min(numEnemies, regions.length);
            
            // Embaralha as regiões para variar as posições iniciais
            const shuffledRegions = [...regions];
            for (let i = shuffledRegions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledRegions[i], shuffledRegions[j]] = [shuffledRegions[j], shuffledRegions[i]];
            }
            
            // Para cada inimigo, usa uma região diferente
            for (let i = 0; i < actualNumEnemies; i++) {
                const basePosition = shuffledRegions[i];
                
                // Tenta encontrar uma posição válida próxima à região base
                let enemy = null;
                let attempts = 0;
                let maxRadius = 1; // Começa com raio pequeno
                
                while (!enemy && attempts < 20) {
                    // Aumenta o raio de busca a cada 5 tentativas
                    if (attempts % 5 === 0) {
                        maxRadius = Math.min(maxRadius + 1, 3);
                    }
                    
                    // Adiciona uma variação baseada no raio atual
                    const testX = basePosition.x + (Math.floor(Math.random() * (maxRadius * 2 + 1)) - maxRadius);
                    const testY = basePosition.y + (Math.floor(Math.random() * (maxRadius * 2 + 1)) - maxRadius);
                    
                    // Garante que a posição está dentro dos limites do labirinto
                    if (testX <= 0 || testX >= MAZE_SIZE - 1 || testY <= 0 || testY >= MAZE_SIZE - 1) {
                        attempts++;
                        continue;
                    }
                    
                    // Verifica se a posição é válida
                    if (maze[testY][testX] === 0 && 
                        !enemies.some(e => Math.abs(e.x - testX) < 3 && Math.abs(e.y - testY) < 3) &&
                        (Math.abs(player.x - testX) + Math.abs(player.y - testY)) > 6) { // Distância mínima do jogador
                        enemy = { x: testX, y: testY };
                    }
                    
                    attempts++;
                }
                
                // Se não encontrou posição com variação, usa a posição base com verificação adicional
                if (!enemy) {
                    // Verifica se a posição base é válida
                    if (maze[basePosition.y][basePosition.x] === 0 &&
                        !enemies.some(e => Math.abs(e.x - basePosition.x) < 2 && Math.abs(e.y - basePosition.y) < 2)) {
                        enemy = { x: basePosition.x, y: basePosition.y };
                    } else {
                        // Última tentativa: procura qualquer posição válida longe do jogador
                        for (let y = 1; y < MAZE_SIZE - 1; y++) {
                            for (let x = 1; x < MAZE_SIZE - 1; x++) {
                                if (maze[y][x] === 0 &&
                                    !enemies.some(e => Math.abs(e.x - x) < 2 && Math.abs(e.y - y) < 2) &&
                                    (Math.abs(player.x - x) + Math.abs(player.y - y)) > 6) {
                                    enemy = { x, y };
                                    break;
                                }
                            }
                            if (enemy) break;
                        }
                    }
                }
                
                // Se ainda não encontrou posição, usa a base com offset mínimo
                if (!enemy) {
                    enemy = { 
                        x: Math.max(1, Math.min(MAZE_SIZE - 2, basePosition.x + (i % 2))),
                        y: Math.max(1, Math.min(MAZE_SIZE - 2, basePosition.y + (i % 2)))
                    };
                }
                
                enemies.push(enemy);
            }
            
            return enemies;
        }

        // Nova função para reposicionar um único inimigo
        function repositionEnemy(currentEnemy) {
            // Encontra todas as posições válidas e suas distâncias do jogador
            let bestPosition = null;
            let maxDistance = -1;
            
            for (let testY = 1; testY < MAZE_SIZE - 1; testY++) {
                for (let testX = 1; testX < MAZE_SIZE - 1; testX++) {
                    // Verifica se é uma posição válida
                    if (maze[testY][testX] !== 0) continue;
                    
                    // Verifica se está ocupado por outro inimigo
                    if (enemies.some(e => 
                        e !== currentEnemy && // Não é o próprio inimigo
                        ((e.x === testX && e.y === testY) || // Exatamente mesma posição
                        (Math.abs(e.x - testX) < 2 && Math.abs(e.y - testY) < 2)) // Células adjacentes
                    )) continue;
                    
                    // Calcula distância Manhattan do jogador
                    const distance = Math.abs(player.x - testX) + Math.abs(player.y - testY);
                    
                    // Atualiza melhor posição se encontrar uma distância maior
                    if (distance > maxDistance) {
                        maxDistance = distance;
                        bestPosition = { x: testX, y: testY };
                    }
                }
            }
            
            // Se encontrou uma posição válida, usa ela
            if (bestPosition) {
                return bestPosition;
            }
            
            // Fallback para o canto mais distante do jogador com pequena variação
            const offsetX = Math.floor(Math.random() * 3) - 1;
            const offsetY = Math.floor(Math.random() * 3) - 1;
            return {
                x: Math.max(1, Math.min(MAZE_SIZE - 2, ((player.x < MAZE_SIZE/2) ? MAZE_SIZE - 2 : 1) + offsetX)),
                y: Math.max(1, Math.min(MAZE_SIZE - 2, ((player.y < MAZE_SIZE/2) ? MAZE_SIZE - 2 : 1) + offsetY))
            };
        }

        // Função auxiliar para verificar se uma posição é caminho válido para inimigos
        function isValidPath(x, y) {
            // Considera como caminho válido:
            // - Caminhos normais (0)
            // - Células com balas (2)
            // - Células com corações (3)
            return maze[y][x] === 0 || maze[y][x] === 2 || maze[y][x] === 3;
        }

        // Encontra o menor caminho até o player usando BFS
        function findPathToPlayer(enemy) {
            const queue = [{x: enemy.x, y: enemy.y, path: []}];
            const visited = new Set([`${enemy.x},${enemy.y}`]);
            
            // Direções possíveis: cima, direita, baixo, esquerda
            const directions = [{dx: 0, dy: -1}, {dx: 1, dy: 0}, {dx: 0, dy: 1}, {dx: -1, dy: 0}];
            
            while (queue.length > 0) {
                const current = queue.shift();
                
                // Encontrou o player
                if (current.x === player.x && current.y === player.y) {
                    return current.path[0] || current; // Retorna primeiro passo ou posição atual
                }
                
                // Tenta todas as direções
                for (const {dx, dy} of directions) {
                    const nextX = current.x + dx;
                    const nextY = current.y + dy;
                    const key = `${nextX},${nextY}`;
                    
                    // Verifica se movimento é válido
                    if (nextX >= 0 && nextX < MAZE_SIZE && 
                        nextY >= 0 && nextY < MAZE_SIZE && 
                        isValidPath(nextX, nextY) && 
                        !visited.has(key) &&
                        !enemies.some(e => e !== enemy && e.x === nextX && e.y === nextY)) {
                        
                        visited.add(key);
                        const newPath = [...current.path, {x: nextX, y: nextY}];
                        queue.push({x: nextX, y: nextY, path: newPath});
                    }
                }
            }
            
            return null; // Não encontrou caminho
        }

        // Move o inimigo em direção ao player
        function moveEnemy(enemy) {
            if (enemy.exploding) return;
            
            const nextMove = findPathToPlayer(enemy);
            if (!nextMove) return; // Se não há caminho, não move
            
            // Move para a próxima posição do caminho
            enemy.x = nextMove.x;
            enemy.y = nextMove.y;
        }         

        function checkCollision() {
            if (isGameOver) return;

            // Verifica coleta de coração
            if (maze[player.y][player.x] === 3) {
                maze[player.y][player.x] = 0;
                if (lives < 5) {
                    lives++;
                    updateLives();
                    audioManager.play('collectTreasure'); // Usa o mesmo som da coleta de tesouro
                }
                return;
            }

            // Verifica colisão com inimigos
            const hitEnemy = enemies.find(enemy => 
                enemy.x === player.x && 
                enemy.y === player.y && 
                !enemy.exploding  // Adiciona esta verificação
            );

            if (hitEnemy) {
                lives--;
                updateLives();

                if (lives > 0) {
                    audioManager.play('playerDeath'); // Adiciona som de morte do jogador
                }

                if (lives <= 0) {
                    gameOver();
                } else {

                    // Reposiciona o jogador
                    player = { x: 1, y: 1 };

                    // Reposiciona todos os inimigos
                    enemies = initializeEnemies(enemies.length); 
                }
                return;
            }
            
            // Verifica coleta de tesouro
            const treasureIndex = treasures.findIndex(t => t.x === player.x && t.y === player.y);
            if (treasureIndex !== -1) {
                treasures.splice(treasureIndex, 1);
                score += 2000;
                audioManager.play('collectTreasure'); // Adiciona som de coleta
                
                if (treasures.length === 0) {
                    // Adiciona um pequeno delay antes de chamar levelUp
                    setTimeout(() => {
                        levelUp();
                    }, 300); // 300ms de delay
                }
            }

            // Verifica coleta de balas
            if (maze[player.y][player.x] === 2) {
                maze[player.y][player.x] = 0;
                addBullet();
            }
        }

        function levelUp() {
            level++;
            score += 10000;
            maze = createMaze();
            player = { x: 1, y: 1 };
            
            audioManager.play('levelUp');
            
            // Calcula número de inimigos baseado no nível até 6
            let numEnemies = Math.min(1 + Math.floor((level - 1) / 3), 6);
            
            // Depois de chegar em 6 inimigos (level >18), mostra aleatorio entre 1 e 4
            if (level > 18) {
                numEnemies = Math.floor(Math.random() * 4) + 1;
            }    
             
            // Usa a nova função para inicializar inimigos
            enemies = initializeEnemies(numEnemies);
            
            // Calcula probabilidade de spawn de balas
            bulletSpawnChance = Math.min(0.05 + (level * 0.02), 0.3);
            
            // Adiciona balas baseado no nível
            const minBullets = 2 + Math.floor(level / 3);
            for (let i = 0; i < minBullets; i++) {
                generateNewBullet();
            }
            
            placeTreasures();
        }

        function gameOver() {

            // Toca a melodia de game over
            audioManager.play('gameOver');

            stopContinuousMove();
            isGameOver = true;
            clearInterval(gameInterval);
            document.getElementById('gameOver').classList.add('active');
            document.getElementById('finalScore').textContent = score.toLocaleString();
            document.getElementById('finalLevel').textContent = level;
        }

        function startGame() {
            stopContinuousMove();
            isGameOver = false;
            level = 1;
            score = 0;
            lives = 5;
            bullets = 30;
            updateBulletsDisplay();
            maze = createMaze();
            player = { x: 1, y: 1 };
            enemies = initializeEnemies(1);
            placeTreasures();
            document.getElementById('gameOver').classList.remove('active');
            updateLives();
            
            if (gameInterval) {
                clearInterval(gameInterval);
            }
            
            setGameInterval();
      }

      function setGameInterval() {

            let moveAccumulator = 0;
            moveCounter = 0;

            // Constantes para velocidade
            const BASE_INTERVAL = 200; // Intervalo base do setInterval em ms
            const BASE_ENEMY_SPEED = 5; // Quantos ticks para mover (5 = mover a cada 1 segundo)
            const SPEED_INCREASE = 0.5; // Quanto diminui do intervalo a cada nível

            gameInterval = setInterval(() => {
                if (!isPaused) {
                    moveCounter++;
                    
                    // Calcula intervalo de movimento baseado no nível
                    // Começa em 5 ticks (1 segundo) e diminui 0.5 a cada nível
                    const moveInterval = Math.max(
                        BASE_ENEMY_SPEED - (Math.floor((level - 1) / 3) * SPEED_INCREASE), 
                        1.2 // Nunca mais rápido que 1.2 ticks
                    );
                    
                    // Move quando o contador atinge o intervalo
                    if (moveCounter >= moveInterval) {
                        enemies.forEach(moveEnemy);
                        moveCounter = 0; // Reseta o contador
                    }

                    updateShots();
                    checkCollision();
                    renderMaze();
                    
                    if (Math.random() < bulletSpawnChance) {
                        generateNewBullet();
                    }

                    if (lives <= 2 && Math.random() < heartSpawnChance) {
                        generateHeart();
                    }
                }
            }, BASE_INTERVAL); // 200ms = 5 ticks por segundo
        }

        function updateBulletsDisplay() {
            document.getElementById('bullets').textContent = bullets;
        }

        function generateNewBullet() {
            // Conta quantas balas existem no mapa
            let currentBullets = 0;
            for (let y = 0; y < MAZE_SIZE; y++) {
                for (let x = 0; x < MAZE_SIZE; x++) {
                    if (maze[y][x] === 2) currentBullets++;
                }
            }

            // Se já tiver muitas balas, não gera mais
            const maxBullets = 3 + Math.floor(level / 3); // Aumenta com o nível
            if (currentBullets >= maxBullets) return false;

            // Lista todas as posições válidas
            const validPositions = [];
            for (let y = 1; y < MAZE_SIZE - 1; y++) {
                for (let x = 1; x < MAZE_SIZE - 1; x++) {
                    // Verifica se é um caminho e está longe do jogador e inimigos
                    const farFromPlayer = Math.abs(x - player.x) + Math.abs(y - player.y) > 3;
                    const farFromEnemies = !enemies.some(e => 
                        Math.abs(e.x - x) < 3 && Math.abs(e.y - y) < 3
                    );
                    
                    if (maze[y][x] === 0 && farFromPlayer && farFromEnemies) {
                        validPositions.push({x, y});
                    }
                }
            }

            // Se encontrou posições válidas, escolhe uma aleatoriamente
            if (validPositions.length > 0) {
                const pos = validPositions[Math.floor(Math.random() * validPositions.length)];
                maze[pos.y][pos.x] = 2;
                return true;
            }

            return false;
        }

        function movePlayer(direction) {
            if (isGameOver || isPaused) return;

            lastDirection = direction;
            const newPlayer = { ...player };
            
            if (direction === 'up') newPlayer.y--;
            else if (direction === 'down') newPlayer.y++;
            else if (direction === 'left') newPlayer.x--;
            else if (direction === 'right') newPlayer.x++;
            
            // Modifique esta linha para permitir movimento sobre balas e corações
            if (maze[newPlayer.y][newPlayer.x] === 0 || 
                maze[newPlayer.y][newPlayer.x] === 2 || 
                maze[newPlayer.y][newPlayer.x] === 3) {
                player = newPlayer;
                checkCollision();
                renderMaze();
            }
        }

        // Controles de teclado
        // Adicione esta função para prevenir as teclas padrão
        function preventDefaultForArrowKeys(e) {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault();
            }
        }

        // Modifique o event listener do teclado para incluir a prevenção
        document.addEventListener('keydown', (e) => {
            // Previne scroll com teclas direcionais
            preventDefaultForArrowKeys(e);

            // Lógica de game over e Enter
            if (isGameOver && e.key === 'Enter') {
                startGame();
                return;
            }

            // Movimento do jogador
            if (isGameOver) return;

            const key = e.key;
            
            if (key === 'ArrowUp') movePlayer('up');
            else if (key === 'ArrowDown') movePlayer('down');
            else if (key === 'ArrowLeft') movePlayer('left');
            else if (key === 'ArrowRight') movePlayer('right');

            // Controle do tiro
            if (e.key === ' ' || e.code === 'Space') {
                shoot();
                return;
            }
            
            // Tecla P para pausar
            if (e.key === 'p' || e.key === 'P') {
                togglePause();
            }
        });

        // Opcionalmente, também previna o scroll quando as teclas estiverem pressionadas
        document.addEventListener('keypress', preventDefaultForArrowKeys);

        // Previne comportamentos indesejados do touch
        document.addEventListener('touchstart', (e) => {
            if (e.target.classList.contains('control-btn')) {
                e.preventDefault();
            }
        }, { passive: false });

        // Impede que o usuário dê zoom na tela mobile com double tap
        document.addEventListener('dblclick', (e) => {
            e.preventDefault();
        }, { passive: false });

        
        // Função auxiliar para iniciar movimento contínuo
        function startContinuousMove(direction) {
            if (moveInterval && currentDirection === direction) return;
            
            stopContinuousMove(); // Limpa qualquer movimento anterior
            currentDirection = direction;
            holdStartTime = Date.now();
            
            movePlayer(direction); // Move imediatamente
            
            moveInterval = setInterval(() => {
                movePlayer(direction);
                
                // Calcula quanto tempo o botão está sendo segurado
                const holdDuration = Date.now() - holdStartTime;
                
                // Ajusta a velocidade baseado no tempo segurado
                if (holdDuration > 500) { // Após 0.5 segundo
                    clearInterval(moveInterval);
                    moveInterval = setInterval(() => {
                        movePlayer(direction);
                    }, 30); // Muito rápido
                } else if (holdDuration > 200) { // Após 0.2 segundos
                    clearInterval(moveInterval);
                    moveInterval = setInterval(() => {
                        movePlayer(direction);
                    }, 100); // Rápido
                }
            }, moveSpeed);
        }

        function stopContinuousMove() {
            if (moveInterval) {
                clearInterval(moveInterval);
                moveInterval = null;
            }
            moveSpeed = 150; // Reseta a velocidade
            currentDirection = null;
            holdStartTime = 0;
        }

        function addBullet() {
            bullets++;
            updateBulletsDisplay();
        }

        function updateBulletsDisplay() {
            const bulletDisplay = document.getElementById('bullets');
            bulletDisplay.textContent = bullets;
        }

        function findNearestEnemy(fromX, fromY) {
            // Filtra inimigos que não estão explodindo e ordena por distância
            const validEnemies = enemies
                .filter(enemy => !enemy.exploding)
                .map(enemy => ({
                    enemy,
                    distance: Math.abs(fromX - enemy.x) + Math.abs(fromY - enemy.y)
                }))
                .sort((a, b) => a.distance - b.distance);
            
            return validEnemies.length > 0 ? validEnemies[0].enemy : null;
        }

        function getDirectionToEnemy(fromX, fromY, enemy) {
            const dx = enemy.x - fromX;
            const dy = enemy.y - fromY;
            
            // Tenta primeiro a direção com maior distância (mais provável de ter caminho)
            if (Math.abs(dx) > Math.abs(dy)) {
                // Tenta horizontalmente primeiro
                const dirX = dx > 0 ? 'right' : 'left';
                // Verifica se há parede imediata na direção horizontal
                if (dx > 0 && maze[fromY][fromX + 1] !== 1 || 
                    dx < 0 && maze[fromY][fromX - 1] !== 1) {
                    return dirX;
                }
                // Se há parede, tenta verticalmente
                const dirY = dy > 0 ? 'down' : 'up';
                if (dy > 0 && maze[fromY + 1][fromX] !== 1 || 
                    dy < 0 && maze[fromY - 1][fromX] !== 1) {
                    return dirY;
                }
            } else {
                // Tenta verticalmente primeiro
                const dirY = dy > 0 ? 'down' : 'up';
                // Verifica se há parede imediata na direção vertical
                if (dy > 0 && maze[fromY + 1][fromX] !== 1 || 
                    dy < 0 && maze[fromY - 1][fromX] !== 1) {
                    return dirY;
                }
                // Se há parede, tenta horizontalmente
                const dirX = dx > 0 ? 'right' : 'left';
                if (dx > 0 && maze[fromY][fromX + 1] !== 1 || 
                    dx < 0 && maze[fromY][fromX - 1] !== 1) {
                    return dirX;
                }
            }
            
            // Se não encontrou direção sem parede, retorna null
            return null;
        }

        function shoot() {
            if (bullets <= 0 || isPaused) return;
            
            const nearestEnemy = findNearestEnemy(player.x, player.y);
            if (!nearestEnemy) return; // Não atira se não houver inimigos vivos
            
            const direction = getDirectionToEnemy(player.x, player.y, nearestEnemy);
            if (!direction) return; // Não atira se não houver direção válida
            
            bullets--;
            updateBulletsDisplay();
            audioManager.play('shoot');

            const shot = {
                x: player.x,
                y: player.y,
                direction: direction
            };
            
            shots.push(shot);
        }

        function updateShots() {
            for (let i = shots.length - 1; i >= 0; i--) {
                const shot = shots[i];
                let nextX = shot.x;
                let nextY = shot.y;
                
                switch(shot.direction) {
                    case 'up': nextY--; break;
                    case 'down': nextY++; break;
                    case 'left': nextX--; break;
                    case 'right': nextX++; break;
                }
                
                // Remove tiro se bater em parede
                if (maze[nextY][nextX] === 1) {
                    shots.splice(i, 1);
                    continue;
                }
                
                // Verifica colisão com inimigos na posição atual E na próxima posição
                const hitEnemy = enemies.findIndex(enemy => {
                    // Verifica colisão na posição atual da bala
                    if (enemy.x === shot.x && enemy.y === shot.y) return true;
                    // Verifica colisão na próxima posição da bala
                    if (enemy.x === nextX && enemy.y === nextY) return true;
                    // Verifica se o inimigo e a bala "cruzaram" caminhos
                    if (enemy.x === nextX && enemy.y === shot.y) return true;
                    if (enemy.x === shot.x && enemy.y === nextY) return true;
                    return false;
                });
                
                if (hitEnemy !== -1 && !enemies[hitEnemy].exploding) {
                    enemies[hitEnemy].exploding = true;
                    shots.splice(i, 1);
                    score += 1000; // Adiciona 1000 pontos por inimigo morto
                    document.getElementById('score').textContent = score.toLocaleString(); // Atualiza o placar
                    audioManager.play('enemyDeath'); // Adiciona som de morte do inimigo

                    // Posição atual do inimigo atingido
                    const currentX = enemies[hitEnemy].x;
                    const currentY = enemies[hitEnemy].y;
                    
                    setTimeout(() => {
                        if (enemies[hitEnemy]) {
                            enemies[hitEnemy].exploding = false;
                            const newPos = repositionEnemy(enemies[hitEnemy]);
                            enemies[hitEnemy].x = newPos.x;
                            enemies[hitEnemy].y = newPos.y;
                        }
                    }, 300);
                    continue;
                }
                
                shot.x = nextX;
                shot.y = nextY;
            }
        }

        function togglePause() {
            if (isGameOver) return;
            
            isPaused = !isPaused;
            const pauseOverlay = document.getElementById('pauseOverlay');
            
            if (isPaused) {
                // Para tudo limpando o intervalo principal do jogo
                clearInterval(gameInterval);
                pauseOverlay.classList.remove('hidden');
            } else {
                pauseOverlay.classList.add('hidden');

                // Recria o intervalo principal do jogo
                setGameInterval();
            }
        }

        function generateHeart() {

            // Só gera coração se o jogador estiver com 1 ou 2 vidas
            if (lives > 2) return false;

            // Lista todas as posições válidas
            const validPositions = [];
            for (let y = 1; y < MAZE_SIZE - 1; y++) {
                for (let x = 1; x < MAZE_SIZE - 1; x++) {
                    // Verifica se é um caminho e está longe do jogador e inimigos
                    const farFromPlayer = Math.abs(x - player.x) + Math.abs(y - player.y) > 3;
                    const farFromEnemies = !enemies.some(e => 
                        Math.abs(e.x - x) < 3 && Math.abs(e.y - y) < 3
                    );
                    
                    if (maze[y][x] === 0 && farFromPlayer && farFromEnemies) {
                        validPositions.push({x, y});
                    }
                }
            }

            // Se encontrou posições válidas, escolhe uma aleatoriamente
            if (validPositions.length > 0) {
                const pos = validPositions[Math.floor(Math.random() * validPositions.length)];
                maze[pos.y][pos.x] = 3; // 3 representa um coração
                return true;
            }

            return false;
        }

        // Joystick virtual (mobile)
        (function setupJoystick() {
            const base = document.getElementById('joystick');
            const knob = document.getElementById('joystickKnob');
            const DEAD_ZONE = 14;   // px antes de começar a mover
            const HYSTERESIS = 1.3; // evita trocar de direção na diagonal
            let activePointer = null;
            let joyDirection = null;

            function maxRadius() {
                return (base.clientWidth - knob.clientWidth) / 2;
            }

            function resetKnob() {
                knob.style.transform = 'translate(0px, 0px)';
            }

            function pickDirection(dx, dy) {
                const ax = Math.abs(dx);
                const ay = Math.abs(dy);
                if (Math.hypot(dx, dy) < DEAD_ZONE) return null;

                // Mantém a direção atual se o outro eixo não dominar com folga
                if (joyDirection === 'left' || joyDirection === 'right') {
                    if (ay <= ax * HYSTERESIS) return dx < 0 ? 'left' : 'right';
                } else if (joyDirection === 'up' || joyDirection === 'down') {
                    if (ax <= ay * HYSTERESIS) return dy < 0 ? 'up' : 'down';
                }
                if (ax > ay) return dx < 0 ? 'left' : 'right';
                return dy < 0 ? 'up' : 'down';
            }

            function update(e) {
                const rect = base.getBoundingClientRect();
                let dx = e.clientX - (rect.left + rect.width / 2);
                let dy = e.clientY - (rect.top + rect.height / 2);
                const dist = Math.hypot(dx, dy);
                const max = maxRadius();
                const kx = dist > max ? dx / dist * max : dx;
                const ky = dist > max ? dy / dist * max : dy;
                knob.style.transform = `translate(${kx}px, ${ky}px)`;

                const dir = pickDirection(dx, dy);
                if (dir !== joyDirection) {
                    joyDirection = dir;
                    if (dir) startContinuousMove(dir);
                    else stopContinuousMove();
                }
            }

            function release(e) {
                if (e.pointerId !== activePointer) return;
                activePointer = null;
                joyDirection = null;
                base.classList.remove('active');
                resetKnob();
                stopContinuousMove();
            }

            base.addEventListener('pointerdown', (e) => {
                if (activePointer !== null) return;
                e.preventDefault();
                activePointer = e.pointerId;
                base.setPointerCapture(e.pointerId);
                base.classList.add('active');
                update(e);
            });

            base.addEventListener('pointermove', (e) => {
                if (e.pointerId !== activePointer) return;
                e.preventDefault();
                update(e);
            });

            base.addEventListener('pointerup', release);
            base.addEventListener('pointercancel', release);
            base.addEventListener('lostpointercapture', release);
            base.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
            base.addEventListener('contextmenu', (e) => e.preventDefault());
        })();

        // Mobile
        document.getElementById('btnShoot').addEventListener('touchstart', (e) => {
            e.preventDefault();
            shoot();
        });

        document.getElementById('btnShoot').addEventListener('click', () => {
            shoot();
        });

        // Pause/Resume
        document.getElementById('pauseButton').addEventListener('click', togglePause);
        document.getElementById('resumeButton').addEventListener('click', togglePause);

        // Inicia o jogo
        startGame();
    </script>
</body>
</html>
